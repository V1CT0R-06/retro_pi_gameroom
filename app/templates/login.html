{% extends 'base.html' %}{% block content %}<h1>Entrar na aplicação</h1><p>Usa a tua conta de voluntário ou de administrador. O PIN partilhado só funciona se estiver ativo.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Utilizador / nome do voluntário<input name="volunteer" maxlength="60" required autocomplete="username"></label><label>Palavra-passe / PIN do evento<input name="pin" type="password" required autocomplete="current-password"></label><button>Entrar</button></form>{% endblock %}
